name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: Build the client without the server
      run: cargo build -p crazyflie-connection-server --no-default-features
    # Also fails when docs/ doesn't match the protocol crate
    - name: Run tests
      run: cargo test --all-features
    - name: Package
      run: cargo publish --workspace --dry-run
